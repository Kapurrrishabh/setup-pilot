# SetupPilot settings. Secrets (API keys, DB URL) go in .env, never here.

logging:
  level: INFO
  file: logs/setuppilot.jsonl
  # PROVISIONAL: two days of heavy testing wrote 0.6 MB, so 10 MB x 3 old files is plenty.
  max_file_mb: 10
  backup_count: 3

groq:
  base_url: https://api.groq.com/openai/v1
  # PROVISIONAL retry settings. Tries per model, then we switch to the small model or stop.
  timeout_seconds: 30
  max_attempts: 4
  backoff_base_seconds: 1
  backoff_max_seconds: 30
  # PROVISIONAL limits, copied from https://console.groq.com/docs/rate-limits on 2026-11-01.
  # Replace them with the numbers shown for your account at https://console.groq.com/settings/limits
  big:
    name: openai/gpt-oss-120b
    # Low effort means less hidden reasoning, so fewer tokens. Raise it if answers get worse.
    reasoning_effort: low
    limits:
      requests_per_minute: 30
      requests_per_day: 1000
      tokens_per_minute: 8000
      tokens_per_day: 200000
  small:
    name: openai/gpt-oss-20b
    reasoning_effort: low
    limits:
      requests_per_minute: 30
      requests_per_day: 1000
      tokens_per_minute: 8000
      tokens_per_day: 200000

# PROVISIONAL: a setup run should need 3-6 calls of about 2-4k tokens each.
# Check real usage on the Metrics page after Phase 7 and adjust.
budget:
  tokens_per_run: 30000
  tokens_per_day: 300000

# PROVISIONAL: one server needs only a few connections, and the free Supabase pooler has a low cap.
database:
  pool_max_size: 4
  connect_timeout_seconds: 10

repo:
  # PROVISIONAL: the total size of the repo's files (not its history). Fits most libraries
  # and apps; raise it if a real repo you need is refused.
  max_size_mb: 200
  clone_timeout_seconds: 300
  # Cap on the file tree summary sent to the LLM, to keep prompts small.
  max_tree_chars: 6000

runner:
  # PROVISIONAL: a big install (a Rust build, say) can take many minutes on a slow laptop.
  timeout_seconds: 900
  # Keep only the end of long output; errors are usually at the end.
  max_output_chars: 20000

agent:
  # Stops a run that loops (for example, edit after edit). PROVISIONAL: with the limits below,
  # the longest run takes 56 steps: 8 base, 3 per install round, 2 per command (up to 9) and 7
  # per AI fix (the diagnosis, 2 fixes, the command again). The other 14 leave room for edits.
  max_steps: 70
  # PROVISIONAL: gpt-oss reasoning tokens count toward these too.
  report_max_tokens: 600
  # false: no AI analysis or diagnosis; the run uses only the files and SetupPilot's own plans.
  use_ai_planning: true
  # PROVISIONAL: the repo facts sent to the AI. 8000 keeps the biggest analyze call near 7,000
  # tokens by SetupPilot's estimate (measured on 7 repos, 2026-11-12), under the 8,000 a minute.
  max_evidence_chars: 8000
  # PROVISIONAL, gpt-oss reasoning included: 12 real analyze answers used 340-1,230 (8 repos,
  # 2026-11-12) and 3 real diagnoses fit too. Raise them if the run notes say "cut off".
  analyze_max_tokens: 2000
  diagnose_max_tokens: 900
  # PROVISIONAL: picked, not measured; raise them if real repos often need more.
  max_install_rounds: 3
  max_fixes_per_step: 2
  max_fixes_per_run: 3

chat:
  # Runs on your machine; no paid embedding API. Its size (384) is fixed in 002_chat.sql.
  # Chunks are cut to fit the window this model reports (256 tokens for this one).
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embedding_dimensions: 384
  # Repos cloned just for the chatbot go here.
  repos_dir: workspace/chat-repos
  max_file_bytes: 200000
  # Keeps the free database small: about 6 MB per repo at this size, with the vectors and the
  # word index (measured on local Postgres, 2026-11-12, 1,500 chunks of Python code).
  max_chunks_per_repo: 1500
  top_k: 5
  max_chunks_per_file: 2
  # The LLM is skipped ("not found", no tokens) only when no chunk is this close AND no word of
  # the question is in the repo. Measured on eval/chat_questions.yaml (2026-11-12): that skips 3
  # of 5 off-topic questions and none of the 64 answerable ones.
  min_similarity: 0.2
  # PROVISIONAL: gpt-oss counts its hidden reasoning in this too. Not
  # measured yet: that needs a Groq key.
  answer_max_tokens: 1200
  # Every turn not yet summarised goes into each prompt (up to twice this many; more while the
  # summary fails, as it is retried each question). Older ones are folded into a short summary
  # (one small-model call every history_turns questions).
  history_turns: 4

web:
  # Loopback only: other machines must never reach an app that runs commands here.
  host: 127.0.0.1
  # 5000 is taken by AirPlay on macOS.
  port: 5005
  max_request_bytes: 16384
  # PROVISIONAL: stops a stuck page from flooding the server; far above a person clicking.
  posts_per_minute: 120

github:
  # Sign in with GitHub is off until you register your own GitHub App (README: Sign in with GitHub).
  # Then use its Client ID (not the App ID) and slug, like this:
  #   app: {client_id: Iv23liExample, app_slug: setuppilot-yourname}
  app: null
  # PROVISIONAL: 10 pages of 100 repos for each place the app is installed. Raise it if your
  # repo list says it was cut short.
  max_repo_pages: 10
  # PROVISIONAL: a repo whose files add up to more is cloned instead of read from GitHub.
  # Most libraries and apps are far smaller; check it against the repos you really use.
  max_tarball_mb: 50
